<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP List — Samantha Quince Años</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0c09;color:#ece4d4;
  font-family:'Segoe UI',system-ui,sans-serif;
  padding:40px 24px;
}
h1{font-size:1.4rem;font-weight:600;margin-bottom:4px;color:#dcc898}
.sub{font-size:0.75rem;color:rgba(236,228,212,0.4);margin-bottom:28px}
table{
  width:100%;max-width:1200px;border-collapse:collapse;
  margin:0 auto;font-size:0.85rem;
}
th{
  text-align:left;padding:10px 14px;
  font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;
  color:rgba(0,168,107,0.5);border-bottom:1px solid rgba(196,160,74,0.12);
  font-weight:500;
}
td{
  padding:12px 14px;border-bottom:1px solid rgba(196,160,74,0.04);
  vertical-align:top;line-height:1.4;
}
tr:hover td{background:rgba(196,160,74,0.03)}
.name{font-weight:600;color:#dcc898;min-width:120px}
.phone,.email,.address{color:rgba(236,228,212,0.55);font-size:0.8rem}
.email a{color:rgba(236,228,212,0.55);text-decoration:none}
.email a:hover{color:#dcc898}
.guests{text-align:center;color:rgba(236,228,212,0.5)}
.msg{color:rgba(236,228,212,0.45);font-style:italic;max-width:220px;font-size:0.82rem}
.date{color:rgba(236,228,212,0.25);font-size:0.68rem;white-space:nowrap}
.confirmed{color:rgba(0,168,107,0.4);font-size:0.65rem}
.pending{color:rgba(196,160,74,0.3);font-size:0.65rem}
.empty{text-align:center;padding:60px;color:rgba(236,228,212,0.25)}
.count{font-size:0.75rem;color:rgba(236,228,212,0.4);margin-bottom:20px}
.count strong{color:#dcc898}
.actions{margin-bottom:20px;display:flex;gap:8px}
.btn{
  font-size:0.65rem;padding:6px 14px;
  background:rgba(196,160,74,0.08);
  border:1px solid rgba(196,160,74,0.15);
  color:#dcc898;cursor:pointer;border-radius:6px;
  transition:all 0.2s;
}
.btn:hover{background:rgba(196,160,74,0.15)}
.btn-del{
  font-size:0.6rem;padding:4px 10px;
  background:rgba(220,60,60,0.12);
  border:1px solid rgba(220,60,60,0.2);
  color:rgba(220,100,100,0.7);cursor:pointer;border-radius:5px;
  transition:all 0.2s;
}
.btn-del:hover{background:rgba(220,60,60,0.25);color:#f88}
.back{margin-top:32px;padding-top:16px;border-top:1px solid rgba(196,160,74,0.06)}
.back a{color:rgba(236,228,212,0.25);text-decoration:none;font-size:0.7rem}
.back a:hover{color:rgba(236,228,212,0.5)}
</style>
</head>
<body>

<h1>Samantha · Quince Años</h1>
<p class="sub">Guest Registry</p>

<div class="actions">
  <button class="btn" onclick="refresh()">Refresh</button>
  <button class="btn" onclick="exportCSV()">Export CSV</button>
</div>

<p class="count" id="count"></p>

<table id="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Address</th>
      <th style="text-align:center">Party</th>
      <th>Message</th>
      <th>Date</th>
      <th>Email</th>
      <th style="text-align:center;width:50px"></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="back"><a href="../">← Back to invitation</a></div>

<script>
var allData = [];

function load(){
  // NEVER render a number that isn't real. This used to call render([]) when
  // both sources failed, showing "0 confirmed guests" / "No RSVPs yet" — the
  // same lie the backend was telling. An unreachable source now says so.
  // raw.githubusercontent is CDN-cached, so bust it.
  fetch('https://raw.githubusercontent.com/CRYPTORICH/samantha/main/rsvp_data.json?t='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json()})
    .then(function(data){
      if(!Array.isArray(data)) throw new Error('not a guest list');
      allData = data;
      render(data);
    })
    .catch(function(){
      fetch('https://samantha-rsvp.onrender.com/rsvp')
        .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json()})
        .then(function(d2){
          if(!Array.isArray(d2)) throw new Error('not a guest list');
          allData=d2; render(d2);
        })
        .catch(unavailable);
    });
}

function unavailable(){
  document.getElementById('count').innerHTML='<strong>—</strong> guest list unavailable';
  document.getElementById('tbody').innerHTML=
    '<tr><td colspan="9" class="empty">Could not reach the guest list. '+
    'This is NOT zero RSVPs — do not act on it. Retry in a moment.</td></tr>';
}

function render(data){
  var tbody=document.getElementById('tbody');
  var people=0;
  data.forEach(function(r){ people += partyCell(r); });
  document.getElementById('count').innerHTML=
    '<strong>'+data.length+'</strong> RSVPs &middot; <strong>'+people+'</strong> people';

  if(!data.length){
    tbody.innerHTML='<tr><td colspan="9" class="empty">No RSVPs yet.</td></tr>';
    return;
  }

  tbody.innerHTML=data.sort(function(a,b){return (toDate(b.date)||0)-(toDate(a.date)||0)}).map(function(r,i){
    var id = r._id||('idx'+i);
    return '<tr>'+
      '<td class="name">'+(i+1)+'. '+esc(r.name)+'</td>'+
      '<td class="phone">'+(r.phone?esc(r.phone):'—')+'</td>'+
      '<td class="email">'+(r.email?'<a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a>':'—')+'</td>'+
      '<td class="address">'+(r.address?esc(r.address):'—')+'</td>'+
      '<td class="guests">'+partyCell(r)+'</td>'+
      '<td class="msg">'+(r.message?'"'+esc(r.message)+'"':'—')+'</td>'+
      '<td class="date">'+fmt(r.date)+'</td>'+
      '<td class="'+(r.confirmation_sent?'confirmed':'pending')+'">'+(r.confirmation_sent?'✓ sent':'—')+'</td>'+
      '<td style="text-align:center"><button class="btn-del" data-id="'+esc(id)+'" data-name="'+esc(r.name)+'" title="Delete">✕</button></td>'+
      '</tr>';
  }).join('');
}

document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('button.btn-del');
  if(b) del(b.getAttribute('data-id'), b.getAttribute('data-name'));
});

function adminKey(){
  var k='';
  try{k=localStorage.getItem('sak')||''}catch(e){}
  if(!k){
    k=prompt('Admin key (the ADMIN_KEY set in Render):')||'';
    if(k){try{localStorage.setItem('sak',k)}catch(e){}}
  }
  return k;
}

function del(id, name){
  if(!confirm('Delete RSVP from '+name+'?')) return;
  var k=adminKey();
  if(!k) return;
  fetch('https://samantha-rsvp.onrender.com/rsvp/'+encodeURIComponent(id), {
    method:'DELETE', headers:{'X-Admin-Key':k}
  })
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j}})})
    .then(function(res){
      if(res.s===403){
        try{localStorage.removeItem('sak')}catch(e){}
        alert('Wrong or missing admin key. Nothing was deleted.');
        return;
      }
      if(res.j && res.j.ok) load();
      else alert('Failed to delete: '+((res.j&&res.j.detail)||'unknown'));
    })
    .catch(function(){alert('Delete failed — server may be down')});
}

function partyCell(r){
  // The number the guest typed IS the number of people. Nothing is added.
  var n = parseInt(r.party_size, 10) || parseInt(r.guests, 10) || 0;
  return n > 0 ? n : 1;
}

function esc(s){
  // Escapes BOTH quotes too - esc() is interpolated into HTML attributes, and an
  // unescaped ' used to break the delete button for any O'Brien / D'Angelo.
  var d=document.createElement('div');d.textContent=(s==null?'':s);
  return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* Timestamps come in two shapes:
     older rows  "2026-08-14T22:38:06.733451"        (no offset - it is UTC)
     newer rows  "2026-08-15T15:20:00.123456+00:00"  (explicit)
   JavaScript parses an offset-less datetime as LOCAL time, which is why the
   list used to read 4 hours late and pushed evening RSVPs onto the next day.
   Appending Z when no offset is present makes both shapes parse as UTC; we
   then render in Eastern and label it so there is nothing to second-guess. */
function toDate(d){
  if(!d) return null;
  var s=String(d);
  if(!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(s)) s+='Z';
  var t=new Date(s);
  return isNaN(t.getTime())?null:t;
}
function fmt(d){
  var t=toDate(d); if(!t) return d||'';
  try{return t.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'})}
  catch(e){return t.toISOString()}
}

window.refresh=load;

function exportCSV(){
  if(!allData.length)return;
  var rows=[['#','Name','Phone','Email','Address','Guests','Message','Date','Confirmation Sent']];
  allData.forEach(function(r,i){
    rows.push([i+1,r.name,r.phone||'',r.email||'',r.address||'',r.guests||0,r.message||'',fmt(r.date),r.confirmation_sent?'Yes':'No']);
  });
  // A cell starting = + - @ is executed as a formula by Excel and Sheets even
  // inside quotes. Guest-supplied text must never become a formula.
  function cell(c){
    var v=String(c==null?'':c);
    if(/^[=+@]/.test(v) || v.charAt(0) === '-') v = "'" + v;
    return '"'+v.replace(/"/g,'""')+'"';
  }
  var csv=rows.map(function(r){return r.map(cell).join(',')}).join('\n');
  var b=new Blob(['\uFEFF'+csv],{type:'text/csv'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='samantha-rsvp.csv';a.click();
}

load();
</script>
</body>
</html>
